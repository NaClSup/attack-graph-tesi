  PATHS.sort(function(a, b) {
    var aFail = (a.status === 'FALLIMENTARE') ? 1 : 0;
    var bFail = (b.status === 'FALLIMENTARE') ? 1 : 0;
    if (aFail !== bFail) return aFail - bFail;
    var aCost = (a.cost === null || a.cost === undefined) ? Infinity : a.cost;

  var originalNodes = null;   // stato originale dei nodi (per il reset)
  var originalEdges = null;   // stato originale degli archi (per il reset)

  // Cattura lo stato iniziale di nodi e archi appena la rete e' pronta.
  function captureOriginals() {
    if (originalNodes || typeof network === 'undefined') return;

    network.body.data.nodes.get().forEach(function(n) {
      originalNodes[n.id] = {color: n.color, borderWidth: n.borderWidth, opacity: 1};

  }

  function resetHighlight() {
    captureOriginals();

      return {id: n.id, opacity: 1, borderWidth: 2};
    });
    network.body.data.nodes.update(nodeUpdates);
    var edgeUpdates = originalEdges.map(function(e) {
      return {id: e.id, color: e.color, width: e.width, hidden: false};
    });
    network.body.data.edges.update(edgeUpdates);
    document.querySelectorAll('.path-item').forEach(function(el) {
      el.style.background = '#21262d';

  }

  function readableView() {
    if (typeof network === 'undefined') return;
    var ids = network.body.data.nodes.getIds();
    if (!ids.length) return;
    var bounds = network.getBoundingBox(ids[0]);
    network.moveTo({
      position: {x: (bounds.left + bounds.right) / 2, y: bounds.top},
      scale: 0.62,
      offset: {x: 0, y: 120},
      animation: {duration: 450, easingFunction: 'easeInOutQuad'}
    });
  }

    var oldScale = network.getScale();

    network.redraw();

      document.body.classList.remove('exporting');
      network.redraw();

  // Evidenzia il percorso i-esimo: nodi/archi in risalto, resto sfumato.
  function highlightPath(index) {

    var nodeSet = {};
    pathNodes.forEach(function(id) { nodeSet[id] = true; });

    // Coppie consecutive (arco orientato) appartenenti al percorso.
    var pairSet = {};
    for (var i = 0; i < pathNodes.length - 1; i++) {
      pairSet[pathNodes[i] + '->' + pathNodes[i + 1]] = true;
    }

    // Nodi: quelli del percorso restano pieni ed evidenziati, gli altri sfumati.
    var nodeUpdates = network.body.data.nodes.get().map(function(n) {
      var on = nodeSet[n.id] === true;
      return {id: n.id, opacity: on ? 1 : 0.12, borderWidth: on ? 5 : 1};

      return {id: e.id, color: {color: 'rgba(120,120,120,0.10)'}, width: 0.5, hidden: false};

        captureOriginals();
        buildPathList();
        // Il layout bilanciato ha un rapporto adatto alla vista completa.
        setTimeout(fitAll, 250);
      } else if (tries > 100) {
        clearInterval(timer);
      }
    }, 100);
  })();
</script>


<script type="text/javascript">
(function installStageBands() {
  var labels = {"0": "Stage 0: Initial Access", "1": "Stage 1: Escalation → Ring0", "2": "Stage 2: Ring0 + Gates", "3": "Stage 3: Consolidamento", "4": "Stage 4: Obiettivi"};
  var tries = 0;
  var timer = setInterval(function() {
    tries++;
    if (typeof network === 'undefined') {
      if (tries > 100) clearInterval(timer);
      return;
    }
    clearInterval(timer);
    network.on('beforeDrawing', function(ctx) {
      var grouped = {};
      network.body.data.nodes.get().forEach(function(node) {
        var stage = Number(node.stageIndex || 0);
        if (!grouped[stage]) grouped[stage] = [];
        grouped[stage].push(node.id);
      });

      Object.keys(grouped).sort(function(a, b) { return Number(a) - Number(b); })
        .forEach(function(stage) {
          var boxes = grouped[stage].map(function(id) { return network.getBoundingBox(id); });
          if (!boxes.length) return;
          var left = Math.min.apply(null, boxes.map(function(b) { return b.left; })) - 55;
          var top = Math.min.apply(null, boxes.map(function(b) { return b.top; })) - 62;

          ctx.save();
          ctx.fillStyle = '#aeb8c4';
          ctx.font = "600 24px 'Segoe UI', Arial, sans-serif";
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(labels[stage] || ('Stage ' + stage), left + 22, top + 27);
          ctx.restore();
        });
    });
    network.redraw();
  }, 100);
})();
</script>
